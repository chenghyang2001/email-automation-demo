# daily-briefing.yml
# 排程說明：UTC 23:30 = Asia/Taipei 07:30（隔日），週一至週五自動執行每日晨報
# 執行順序：gmail_fetcher.py → run_briefing.py（兩個獨立 step，前者失敗即停止）

name: Daily Morning Briefing

on:
  schedule:
    - cron: '30 23 * * 0-4'   # UTC 23:30(隔日) = Taiwan (Asia/Taipei) 07:30，週一至週五
  workflow_dispatch:          # 允許手動觸發，方便測試

jobs:
  briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Gmail emails
        run: python gmail_fetcher.py
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}

      - name: Run morning briefing
        run: python run_briefing.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          # Calendar 為選填：未設定 secrets → 空字串 → run_briefing 選填 gate 自動略過
          GCAL_TOKEN_JSON: ${{ secrets.GCAL_TOKEN_JSON }}
          GCAL_CALENDAR_ID: ${{ secrets.GCAL_CALENDAR_ID }}
